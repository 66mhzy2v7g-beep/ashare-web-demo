<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142744"><title>A股智能管家 V2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#142744;color:white;padding:24px 18px}header p{color:#cbd5e1;font-size:13px}main{max-width:720px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #182b4410}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.label{font-size:12px;color:#64748b}.value{font-size:20px;font-weight:700;margin:5px 0 0;overflow-wrap:anywhere}.big{font-size:28px}.stock{border-top:1px solid #e5eaf1;padding:14px 0}.stock:first-child{border-top:0}.stockhead{display:flex;justify-content:space-between;gap:10px}.muted{color:#64748b;font-size:13px}.red{color:#d03039}.green{color:#15803d}button{border:0;border-radius:10px;padding:11px 13px;font-size:14px;background:#183b70;color:white;cursor:pointer}button.secondary{background:#e9eff8;color:#183b70}button.danger{background:#fff0f0;color:#b4232c}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px;font-size:16px;margin-top:5px;background:white}label{display:block;font-size:13px;color:#475569}form .grid{margin-bottom:12px}.notice{font-size:13px;line-height:1.7;color:#64748b}.empty{padding:20px;text-align:center;color:#64748b}#editor{display:none}#editor.show{display:block}</style></head><body><header><h1>A股智能管家 V2.0</h1><p>本机持仓管理 · 手动价格 · 不连接券商</p></header><main><section class="card"><div class="label">账户参考总资产</div><div class="value big" id="total">¥0.00</div><div class="grid" style="margin-top:16px"><div><div class="label">现金余额</div><div class="value" id="cashValue">¥0.00</div></div><div><div class="label">持仓参考市值</div><div class="value" id="market">¥0.00</div></div><div><div class="label">持仓参考盈亏</div><div class="value" id="pnl">¥0.00</div></div><div><div class="label">持仓数量</div><div class="value" id="count">0</div></div></div></section><section class="card"><h2>现金设置</h2><label>现金余额（人民币）<input id="cash" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如 20000"></label><div class="actions"><button id="saveCash">保存现金</button></div></section><section class="card"><h2>我的持仓</h2><div id="holdings"></div><button id="add">＋ 添加股票 / ETF</button></section><section class="card" id="editor"><h2 id="formTitle">添加持仓</h2><form id="form"><div class="grid"><label>股票代码<input id="symbol" maxlength="6" pattern="[0-9]{6}" required placeholder="600487"></label><label>股票名称<input id="name" maxlength="40" required placeholder="亨通光电"></label><label>持仓数量<input id="shares" type="number" min="0.0001" step="any" required inputmode="decimal"></label><label>每股成本（¥）<input id="cost" type="number" min="0.0001" step="any" required inputmode="decimal"></label><label>手动参考现价（¥）<input id="price" type="number" min="0" step="any" required inputmode="decimal"></label></div><div class="actions"><button type="submit">保存持仓</button><button type="button" class="secondary" id="cancel">取消</button></div></form></section><section class="card"><h2>数据备份</h2><p class="notice">数据仅存于当前浏览器的本地存储。清除网站数据、更换设备或重新安装快捷方式可能导致丢失，请定期导出备份。备份文件包含你的持仓信息，请妥善保管。</p><div class="actions"><button id="export">导出 JSON 备份</button><button class="secondary" id="importButton">导入备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></section><section class="card"><h2>系统状态</h2><p class="notice">V2.0 本地管理版。无真实行情、无自动分析、无 Bark 通知、无券商交易权限。参考盈亏不含交易手续费、税费及其他成本。数据不会由本页面主动上传至服务器。</p></section></main><script>'use strict';const KEY='ashare_v2_portfolio_local';let data={cash:0,holdings:[]},editing=-1;const $=id=>document.getElementById(id),money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),validNumber=n=>typeof n==='number'&&Number.isFinite(n);function validate(d){if(!d||!validNumber(d.cash)||d.cash<0||!Array.isArray(d.holdings)||d.holdings.length>1000)throw Error('备份格式不正确');for(const h of d.holdings){if(!/^\d{6}$/.test(h.symbol)||typeof h.name!=='string'||!h.name.trim()||h.name.length>40||!validNumber(h.shares)||h.shares<=0||!validNumber(h.cost)||h.cost<=0||!validNumber(h.price)||h.price<0)throw Error('持仓数据不正确')}return d}try{const stored=localStorage.getItem(KEY);if(stored)data=validate(JSON.parse(stored))}catch(e){alert('本地数据读取失败，请检查或恢复备份：'+e.message)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存失败，请检查浏览器存储权限：'+e.message);return false}}function render(){const market=data.holdings.reduce((s,h)=>s+h.shares*h.price,0),pnl=data.holdings.reduce((s,h)=>s+h.shares*(h.price-h.cost),0);$('total').textContent=money(market+data.cash);$('cashValue').textContent=money(data.cash);$('market').textContent=money(market);$('pnl').textContent=(pnl>0?'+':'')+money(pnl);$('pnl').className='value '+(pnl>=0?'red':'green');$('count').textContent=data.holdings.length;$('cash').value=data.cash;$('holdings').replaceChildren();if(!data.holdings.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='还没有持仓，点击下方按钮添加';$('holdings').append(empty)}data.holdings.forEach((h,i)=>{const item=document.createElement('div');item.className='stock';const head=document.createElement('div');head.className='stockhead';const left=document.createElement('div');const strong=document.createElement('strong');strong.textContent=h.name;const code=document.createElement('div');code.className='muted';code.textContent=h.symbol;left.append(strong,code);const right=document.createElement('strong');right.textContent=money(h.shares*h.price);head.append(left,right);const detail=document.createElement('div');detail.className='grid';detail.style.marginTop='12px';for(const [label,value] of [['持仓数量',String(h.shares)],['成本价',money(h.cost)],['手动参考价',money(h.price)],['参考盈亏',money((h.price-h.cost)*h.shares)+' ('+((h.price/h.cost-1)*100).toFixed(2)+'%)']]){const cell=document.createElement('div'),cap=document.createElement('div'),val=document.createElement('div');cap.className='label';cap.textContent=label;val.textContent=value;cell.append(cap,val);detail.append(cell)}const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='修改';edit.onclick=()=>openEditor(i);const del=document.createElement('button');del.className='danger';del.textContent='删除';del.onclick=()=>{if(confirm('确认删除 '+h.name+' 的持仓记录？')){data.holdings.splice(i,1);if(persist())render()}};actions.append(edit,del);item.append(head,detail,actions);$('holdings').append(item)})}function openEditor(i){editing=i;$('formTitle').textContent=i<0?'添加持仓':'修改持仓';const h=i<0?{symbol:'',name:'',shares:'',cost:'',price:''}:data.holdings[i];for(const k of ['symbol','name','shares','cost','price'])$(k).value=h[k];$('editor').classList.add('show');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}$('add').onclick=()=>openEditor(-1);$('cancel').onclick=()=>$('editor').classList.remove('show');$('form').onsubmit=e=>{e.preventDefault();const h={symbol:$('symbol').value.trim(),name:$('name').value.trim(),shares:Number($('shares').value),cost:Number($('cost').value),price:Number($('price').value)};try{validate({cash:0,holdings:[h]})}catch(err){alert(err.message);return}if(editing<0)data.holdings.push(h);else data.holdings[editing]=h;if(persist()){$('editor').classList.remove('show');render()}};$('saveCash').onclick=()=>{const value=Number($('cash').value);if(!$('cash').value.trim()||!Number.isFinite(value)||value<0){alert('请输入有效的现金余额');return}data.cash=value;if(persist())render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='A股持仓备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1024*1024)throw Error('文件过大');const incoming=validate(JSON.parse(await file.text()));if(confirm('导入将覆盖当前本机持仓和现金，确认继续？')){data=incoming;if(persist())render()}}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};render();</script></body></html>
