
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股持仓管理 V1.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#17243a;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#142744;color:white;padding:28px 20px}
main{max-width:680px;margin:auto;padding:16px}
h1{font-size:23px;margin:0 0 10px}
h2{font-size:17px;margin:0 0 16px}
small{color:#718096}
header small{color:#cbd5e1}
.card{background:white;border-radius:16px;padding:20px;
margin-bottom:16px;box-shadow:0 2px 10px #182b4410}
.amount{font-size:30px;font-weight:700;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label{font-size:13px;color:#64748b}
.value{font-size:19px;font-weight:650;margin-top:6px}
.stock{border-top:1px solid #e5eaf1;padding:16px 0}
.stock:first-child{border-top:0}
.stock-head{display:flex;justify-content:space-between;gap:12px}
.name{font-weight:700}
.code{font-size:13px;color:#64748b;margin-top:4px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;
margin-top:14px;font-size:14px}
.pill{display:inline-block;background:#fff0cc;color:#875600;
padding:6px 10px;border-radius:20px;font-size:12px}
button{background:#183b70;color:white;border:0;
border-radius:10px;padding:13px 16px;font-size:15px;width:100%}
.notice{font-size:13px;color:#64748b;line-height:1.7}
</style>
</head>
<body>
<header>
<h1>A股智能持仓管理</h1>
<small>V1.0 · 手机网页测试版</small>
<p><span class="pill">模拟数据 · 只读模式</span></p>
</header>
<main>
<section class="card">
<div class="label">模拟账户总资产</div>
<div class="amount" id="total">—</div>
<div class="grid">
<div><div class="label">可用现金</div>
<div class="value" id="cash">—</div></div>
<div><div class="label">股票及ETF市值</div>
<div class="value" id="market">—</div></div>
</div>
</section>

<section class="card">
<h2>我的持仓</h2>
<div id="holdings"></div>
</section>

<section class="card">
<h2>系统状态</h2>
<p><span class="pill">安全演示模式</span></p>
<p class="notice">
当前所有持仓及价格均为模拟数据。
不连接券商，不调用真实行情，不发送交易指令，
不读取或修改 config/portfolio.json。
</p>
<button type="button" onclick="render()">刷新模拟数据</button>
</section>
</main>
<script>
"use strict";
const demo = Object.freeze({
 cash:20000,
 holdings:[
 {symbol:"600487",name:"示例股票A",shares:500,cost:50,price:55},
 {symbol:"588000",name:"示例ETF",shares:10000,cost:1.50,price:1.60},
 {symbol:"600360",name:"示例股票B",shares:300,cost:12,price:11}
 ]
});
const money=n=>"¥"+n.toLocaleString("zh-CN",
 {minimumFractionDigits:2,maximumFractionDigits:2});
function render(){
 const market=demo.holdings.reduce((s,h)=>s+h.shares*h.price,0);
 document.getElementById("total").textContent=money(market+demo.cash);
 document.getElementById("cash").textContent=money(demo.cash);
 document.getElementById("market").textContent=money(market);
 const root=document.getElementById("holdings");
 root.replaceChildren();
 for(const h of demo.holdings){
  const item=document.createElement("div");
  item.className="stock";
  const head=document.createElement("div");
  head.className="stock-head";
  const name=document.createElement("div");
  name.className="name";
  name.textContent=h.name;
  const code=document.createElement("div");
  code.className="code";
  code.textContent=h.symbol;
  const left=document.createElement("div");
  left.append(name,code);
  const value=document.createElement("strong");
  value.textContent=money(h.shares*h.price);
  head.append(left,value);
  const details=document.createElement("div");
  details.className="details";
  for(const [label,val] of [
   ["持仓数量",h.shares+" 股/份"],
   ["模拟成本",money(h.cost)],
   ["模拟现价",money(h.price)],
   ["模拟盈亏",((h.price/h.cost-1)*100).toFixed(2)+"%"]
  ]){
   const cell=document.createElement("div");
   const caption=document.createElement("div");
   caption.className="label";
   caption.textContent=label;
   const text=document.createElement("div");
   text.textContent=val;
   cell.append(caption,text);
   details.append(cell);
  }
  item.append(head,details);
  root.append(item);
 }
}
render();
</script>
</body>
</html>
